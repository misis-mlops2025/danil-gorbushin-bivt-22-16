name: CD - Build & Publish to TestPyPI on PR to main

on:
  pull_request:
    branches: [ "main", "master" ]
    types: [opened, reopened, synchronize]

jobs:
  build-and-publish:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Bump version for PR build
        working-directory: project_name
        shell: bash
        run: |
          BASE_VER=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          NEW_VER="${BASE_VER}.dev${GITHUB_RUN_NUMBER}"
          sed -i "s/version = \".*\"/version = \"${NEW_VER}\"/" pyproject.toml
          echo "Version for PR build: ${NEW_VER}"

      - name: Build sdist & wheel
        working-directory: project_name
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          packages-dir: project_name/dist

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: project_name/dist/*
