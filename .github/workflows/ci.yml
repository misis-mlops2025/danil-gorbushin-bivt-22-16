name: CI (lint & tests)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project & dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pylint pytest pytest-cov

      - name: Ruff (format & lint)
        run: |
          ruff format --check .
          ruff check .

      - name: Pylint (>=8.0)
        run: |
          pylint project_name --fail-under=8.0

      - name: Run tests with coverage
        run: |
          pytest -q --cov=project_name --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
