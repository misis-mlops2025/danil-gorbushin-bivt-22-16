name: CI (lint & tests)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project & dev deps
        working-directory: project_name
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pylint pytest pytest-cov

      - name: Ruff
        working-directory: project_name
        run: ruff format --check . && ruff check .

      - name: Pylint
        working-directory: project_name
        run: pylint project_name --fail-under=8.0

      - name: Pytest
        working-directory: project_name
        run: pytest -q --cov=project_name --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: project_name/coverage.xml
