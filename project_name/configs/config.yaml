dataset:
  n_samples: 500
  n_features: 12
  n_informative: 6
  n_redundant: 2
  n_repeated: 0
  n_classes: 2
  flip_y: 0.01
  random_state: 42
  test_size: 0.2
  clip_percentiles: [1.0, 99.0]
  binary_map: {}

model_params:
  model_type: logreg
  random_state: 42
  logreg:
    C: 1.0
    max_iter: 200
  rf:
    n_estimators: 200
    max_depth: 7
  tree:
    max_depth: 5

train:
  cv_folds: 3
  scoring: roc_auc
  save_proba: true